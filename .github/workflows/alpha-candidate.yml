name: Reviewed Blender 5.2.2 alpha candidate validation
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed committed source SHA on blender-5.2.2/alpha
        required: true
      tag:
        description: Explicit reviewed bluehole-vADDON-blender5.2.2-alpha.N tag
        required: true
      reviewed_sha256:
        description: SHA256 inspected after a prior candidate build; verify embedded version and exact tag/repository before approving
        required: false
        default: ''
      create_draft:
        description: Create only a reviewed draft after all required gates
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: blender-5.2.2/alpha
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.2'
      - name: Validate exact dispatch identity
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_COMMIT']"
      - id: manager
        run: python -c "import json,os; d=json.load(open('build-manager-dependency.json'));open(os.environ['GITHUB_OUTPUT'],'a').write('revision='+d['revision']+'\n')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ispaure/build-deployment-manager
          ref: ${{ steps.manager.outputs.revision }}
          submodules: recursive
          path: .manager-tooling
          persist-credentials: false
      - run: python -m pip install --no-deps -e .manager-tooling/Python
      - run: python -m unittest discover -s tests -v
  candidate:
    needs: portable
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: blender-5.2.2/alpha
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.2'
      - id: shared
        run: echo "revision=$(cat Lib/commonUtils.revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ispaure/commonUtils
          ref: ${{ steps.shared.outputs.revision }}
          path: .shared-validation
          persist-credentials: false
      - id: manager
        run: python -c "import json,os; d=json.load(open('build-manager-dependency.json'));open(os.environ['GITHUB_OUTPUT'],'a').write('revision='+d['revision']+'\n')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ispaure/build-deployment-manager
          ref: ${{ steps.manager.outputs.revision }}
          submodules: recursive
          path: .manager-tooling
          persist-credentials: false
      - run: python -m pip install --no-deps -e .manager-tooling/Python
      - name: Require supported Blender and prepare immutable candidate
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          BLUEHOLE_BLENDER: ${{ vars.BLUEHOLE_BLENDER_5_2_2 }}
          BLUEHOLE_SHARED_SOURCE: .shared-validation
        run: python Scripts/hosted_alpha.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bluehole-reviewed-alpha-candidate
          path: test-results/release/
  draft:
    if: ${{ inputs.create_draft }}
    needs: [portable, candidate]
    runs-on: ubuntu-latest
    environment: bluehole-alpha-review
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: blender-5.2.2/alpha
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.2'
      - id: manager
        run: python -c "import json,os; d=json.load(open('build-manager-dependency.json'));open(os.environ['GITHUB_OUTPUT'],'a').write('revision='+d['revision']+'\n')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ispaure/build-deployment-manager
          ref: ${{ steps.manager.outputs.revision }}
          submodules: recursive
          path: .manager-tooling
          persist-credentials: false
      - run: python -m pip install --no-deps -e .manager-tooling/Python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bluehole-reviewed-alpha-candidate
          path: test-results/release/
      - name: Reconcile or create only the explicitly requested draft
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
        run: python Scripts/hosted_alpha.py --create-draft
