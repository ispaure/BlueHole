name: Consumer checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve checked-in line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.2'
      - id: manager
        run: python -c "import json,os; d=json.load(open('build-manager-dependency.json'));open(os.environ['GITHUB_OUTPUT'],'a').write('revision='+d['revision']+'\n')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ispaure/build-deployment-manager
          ref: ${{ steps.manager.outputs.revision }}
          submodules: recursive
          path: .manager-tooling
          persist-credentials: false
      - name: Run portable contracts with the project interpreter
        shell: bash
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == Windows ]]; then
            project_python=./.venv/Scripts/python.exe
          else
            project_python=./.venv/bin/python
          fi
          "$project_python" -m pip install --no-deps -e .manager-tooling/Python
          "$project_python" -m unittest discover -s tests -v
  shared-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: shared
        run: echo "revision=$(cat Lib/commonUtils.revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ispaure/commonUtils
          ref: ${{ steps.shared.outputs.revision }}
          path: .shared-validation
      - run: python .github/scripts/check_shared_copy.py .shared-validation

